name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build for the repository URL
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          base_href="/${repository_name}/"
          if [[ "${repository_name}" == *.github.io ]]; then
            base_href="/"
          fi
          npm run build -- --base-href "${base_href}"
          cp dist/dumb-and-dahmer/browser/index.html dist/dumb-and-dahmer/browser/404.html
          touch dist/dumb-and-dahmer/browser/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/dumb-and-dahmer/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
